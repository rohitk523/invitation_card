<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>For Shramishtha</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&family=Caveat:wght@500;600&family=Jost:wght@300;400&display=swap">
<style>
  /* A letter, delivered with tulips. Single-theme on purpose. */
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% -5%, #F7E3DF 0%, rgba(247,227,223,0) 60%),
      radial-gradient(ellipse 70% 45% at 50% 108%, #EFE3F1 0%, rgba(239,227,241,0) 60%),
      #FBF5EC;
    color: #46323A; font-family: "Jost", "Avenir Next", sans-serif; font-weight: 300;
    padding: 56px 18px 72px; overflow-x: hidden;
  }
  .wrap { max-width: 620px; margin: 0 auto; position: relative; z-index: 2; text-align: center; }
  .eyebrow { font-family: "Caveat", cursive; font-size: 24px; color: #C05B72; margin: 0 0 2px; }
  h1 {
    font-family: "Great Vibes", cursive; font-weight: 400;
    font-size: clamp(52px, 12vw, 84px); color: #7C2E48;
    margin: 0 0 4px; line-height: 1.15;
  }
  .tulip-row { display: block; width: 210px; height: 80px; margin: 4px auto 22px; }

  .letter {
    text-align: left; background: #FDF9F1;
    border: 1px solid #E3D5BD; border-radius: 8px;
    padding: clamp(28px, 6vw, 48px);
    box-shadow: 0 18px 46px rgba(124, 46, 72, .13);
  }
  .letter-title {
    font-family: "Cormorant Garamond", serif; font-weight: 600; font-style: italic;
    font-size: 24px; color: #46323A; text-align: center; margin: 0 0 22px;
  }
  .letter p {
    font-family: "Caveat", cursive; font-size: 21.5px; line-height: 1.6;
    color: #5C4450; margin: 0 0 18px;
  }
  .signoff { text-align: right; font-size: 25px !important; color: #7C2E48 !important; margin: 26px 0 0 !important; }

  .photo { margin: 44px auto 0; max-width: 420px; background: #fff; padding: 12px 12px 14px;
           border: 1px solid #EFE6D8; box-shadow: 0 16px 38px rgba(70, 50, 58, .16);
           transform: rotate(-1.4deg); position: relative; }
  .photo::before {
    content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-2deg);
    width: 80px; height: 22px; background: rgba(195, 163, 104, .35);
  }
  .photo img { width: 100%; display: block; }
  .photo figcaption { font-family: "Caveat", cursive; font-size: 20px; color: #6E5560; padding-top: 10px; }

  .back { display: inline-block; margin-top: 44px; font-family: "Caveat", cursive;
          font-size: 20px; color: #B08D57; text-decoration: none; }
  .back:hover { color: #7C2E48; }

  /* falling tulips */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  .sky svg { position: absolute; top: -80px; width: 26px; height: 42px; opacity: 0; animation: drift linear infinite; }
  .sky svg:nth-child(1) { left: 6%;  animation-duration: 16s; animation-delay: 0s; }
  .sky svg:nth-child(2) { left: 20%; animation-duration: 21s; animation-delay: 5s; }
  .sky svg:nth-child(3) { left: 34%; animation-duration: 18s; animation-delay: 10s; }
  .sky svg:nth-child(4) { left: 55%; animation-duration: 23s; animation-delay: 3s; }
  .sky svg:nth-child(5) { left: 70%; animation-duration: 17s; animation-delay: 12s; }
  .sky svg:nth-child(6) { left: 84%; animation-duration: 20s; animation-delay: 7s; }
  .sky svg:nth-child(7) { left: 93%; animation-duration: 24s; animation-delay: 15s; }
  @keyframes drift {
    0%   { opacity: 0; transform: translateY(0) rotate(-12deg); }
    7%   { opacity: .75; }
    88%  { opacity: .75; }
    100% { opacity: 0; transform: translateY(108vh) rotate(28deg) translateX(-50px); }
  }
  @media (prefers-reduced-motion: reduce) { .sky { display: none; } }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <svg viewBox="-16 0 32 64"><use href="#tulip" style="--head:#C05B72;--inner:#E7AEB6"/></svg>
  <svg viewBox="-16 0 32 64"><use href="#tulip" style="--head:#A78BBA;--inner:#CDB6DD"/></svg>
  <svg viewBox="-16 0 32 64"><use href="#tulip" style="--head:#E7AEB6;--inner:#F3DAD8"/></svg>
  <svg viewBox="-16 0 32 64"><use href="#tulip" style="--head:#C05B72;--inner:#E7AEB6"/></svg>
  <svg viewBox="-16 0 32 64"><use href="#tulip" style="--head:#E7AEB6;--inner:#F3DAD8"/></svg>
  <svg viewBox="-16 0 32 64"><use href="#tulip" style="--head:#A78BBA;--inner:#CDB6DD"/></svg>
  <svg viewBox="-16 0 32 64"><use href="#tulip" style="--head:#C05B72;--inner:#E7AEB6"/></svg>
</div>

<div class="wrap">
  <p class="eyebrow">with tulips, and my whole heart</p>
  <h1>For Shramishtha</h1>

  <svg class="tulip-row" viewBox="0 0 220 84" aria-hidden="true">
    <defs>
      <g id="tulip">
        <path d="M0 32 C0 42 0 52 0 62" stroke="#7C9471" stroke-width="2.4" fill="none"/>
        <path d="M0 46 C-6 42 -11 42 -15 46 C-10 50 -4 50 0 46 Z" fill="#7C9471"/>
        <path d="M0 53 C6 49 11 49 15 53 C10 57 4 57 0 53 Z" fill="#8FA882"/>
        <path d="M-10 16 C-10 6 -6 2 0 6 C6 2 10 6 10 16 C10 24 5 30 0 30 C-5 30 -10 24 -10 16 Z" style="fill:var(--head,#C05B72)"/>
        <path d="M-5 4 C-2 0 2 0 5 4 C4 10 1 14 0 20 C-1 14 -4 10 -5 4 Z" style="fill:var(--inner,#E7AEB6)"/>
      </g>
    </defs>
    <use href="#tulip" transform="translate(60,18) rotate(-12)" style="--head:#E7AEB6;--inner:#F3DAD8"/>
    <use href="#tulip" transform="translate(86,12) rotate(-5)" style="--head:#C05B72;--inner:#E7AEB6"/>
    <use href="#tulip" transform="translate(110,8)" style="--head:#A78BBA;--inner:#CDB6DD"/>
    <use href="#tulip" transform="translate(134,12) rotate(5)" style="--head:#C05B72;--inner:#E7AEB6"/>
    <use href="#tulip" transform="translate(160,18) rotate(12)" style="--head:#E7AEB6;--inner:#F3DAD8"/>
  </svg>

  <div class="letter">
    <p class="letter-title" id="letter-title"></p>
    <div id="letter-body"></div>
  </div>

  <figure class="photo">
    <img src="photos/album/apology.jpg" alt="Rohit holding his ear — the traditional sorry">
    <figcaption>Sorry, said the traditional way. Ear held until forgiven.</figcaption>
  </figure>

  <a class="back" href="./">← back to our diary</a>
</div>

<script src="data.js"></script>
<script>
  document.getElementById("letter-title").textContent = SITE.apology.title;
  document.getElementById("letter-body").innerHTML =
    SITE.apology.paragraphs.map((p) => `<p>${p}</p>`).join("") +
    `<p class="signoff">${SITE.apology.signoff}</p>`;
</script>
</body>
</html>
