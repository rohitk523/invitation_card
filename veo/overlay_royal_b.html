<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>royal ganesh overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
  /* Transparent overlay for the Ganesha blessing segment, 720x1280, 10s. */
  html, body { margin: 0; background: transparent; }
  .frame { position: relative; width: 720px; height: 1280px; overflow: hidden; }
  svg { display: block; width: 720px; height: 1280px; }
  .dev { font-family: "Tiro Devanagari Sanskrit", serif; }

  .rv { opacity: 0; }
  .rv-fade { animation: fadeUp 1.3s cubic-bezier(.22,.61,.36,1) forwards; transform-box: fill-box; }
  #b-shri    { animation-delay: .8s; }
  #b-shloka1 { animation-delay: 2.4s; }
  #b-shloka2 { animation-delay: 3.4s; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); }
                      to   { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="frame">
  <svg viewBox="0 0 720 1280">
    <text id="b-shri" class="rv rv-fade dev" x="360" y="512" font-size="36"
          fill="#3E5C42" text-anchor="middle">&#2358;&#2381;&#2352;&#2368; &#2327;&#2339;&#2375;&#2358;&#2366;&#2351; &#2344;&#2350;&#2307;</text>

    <text id="b-shloka1" class="rv rv-fade dev" x="360" y="598" font-size="27"
          fill="#7C3A2C" text-anchor="middle">&#2357;&#2325;&#2381;&#2352;&#2340;&#2369;&#2339;&#2381;&#2337; &#2350;&#2361;&#2366;&#2325;&#2366;&#2351; &#2360;&#2370;&#2352;&#2381;&#2351;&#2325;&#2379;&#2335;&#2367; &#2360;&#2350;&#2346;&#2381;&#2352;&#2349; &#2404;</text>
    <text id="b-shloka2" class="rv rv-fade dev" x="360" y="652" font-size="27"
          fill="#7C3A2C" text-anchor="middle">&#2344;&#2367;&#2352;&#2381;&#2357;&#2367;&#2328;&#2381;&#2344;&#2306; &#2325;&#2369;&#2352;&#2369; &#2350;&#2375; &#2342;&#2375;&#2357; &#2360;&#2352;&#2381;&#2357;&#2325;&#2366;&#2352;&#2381;&#2351;&#2375;&#2359;&#2369; &#2360;&#2352;&#2381;&#2357;&#2342;&#2366; &#2404;&#2404;</text>
  </svg>
</div>
</body>
</html>
