<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>groom text overlay - marathi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi&family=Yatra+One&display=swap">
<style>
  /* Marathi version of the groom-side 3-scene overlay, 720x1280, 14s.
     No letter-spacing on Devanagari (it breaks the shirorekha rhythm).
     S1 0.7-5.5  S2 5.6-9.7  S3 9.7-14 */
  html, body { margin: 0; background: transparent; }
  .frame { position: relative; width: 720px; height: 1280px; overflow: hidden; }
  svg { display: block; width: 720px; height: 1280px; }

  .dev  { font-family: "Tiro Devanagari Marathi", serif; }
  .disp { font-family: "Yatra One", "Tiro Devanagari Marathi", serif; }

  .rv { opacity: 0; }
  .rv-fade { animation: fadeUp 1.2s cubic-bezier(.22,.61,.36,1) forwards; transform-box: fill-box; }

  #scene1 { animation: sceneOut .8s ease forwards; animation-delay: 4.7s; }
  #scene2 { animation: sceneOut .8s ease forwards; animation-delay: 8.9s; }

  #s1-script { animation: fadeIn .01s linear forwards; animation-delay: .7s; }
  #script-wipe { animation: wipe 2.2s cubic-bezier(.4,0,.3,1) forwards; animation-delay: .7s; }
  #s1-names { animation: nameIn 1.5s cubic-bezier(.22,.61,.36,1) forwards; animation-delay: 2.5s;
              transform-box: fill-box; transform-origin: center; }

  #s2-family  { animation-delay: 5.6s; }
  #s2-invites { animation-delay: 6.2s; }
  #s2-event   { animation-delay: 6.8s; }

  #s3-day     { animation-delay: 9.7s; }
  #s3-date    { animation-delay: 10.15s; }
  #s3-time    { animation-delay: 10.6s; }
  #s3-venue   { animation-delay: 11.05s; }
  #s3-address { animation-delay: 11.5s; }
  #s3-city    { animation-delay: 11.9s; }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes sceneOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); }
                      to   { opacity: 1; transform: translateY(0); } }
  @keyframes nameIn { from { opacity: 0; transform: scale(.93); }
                      to   { opacity: 1; transform: scale(1); } }
  @keyframes wipe { from { width: 0; } to { width: 660px; } }
</style>
</head>
<body>
<div class="frame">
  <svg viewBox="0 0 720 1280">
    <defs>
      <clipPath id="scriptClip"><rect id="script-wipe" x="30" y="495" width="0" height="95"/></clipPath>
    </defs>

    <!-- Scene 1: blessing + names (groom first) -->
    <g id="scene1">
      <g id="s1-script" class="rv">
        <g clip-path="url(#scriptClip)">
          <text class="dev" x="360" y="558" font-size="40" text-anchor="middle" fill="#96733F">&#2405; &#2358;&#2381;&#2352;&#2368; &#2327;&#2339;&#2375;&#2358;&#2366;&#2351; &#2344;&#2350;&#2307; &#2405;</text>
        </g>
      </g>
      <g id="s1-names" class="rv">
        <text class="disp" x="360" y="680" font-size="52" text-anchor="middle" fill="#8A6234">&#2352;&#2379;&#2361;&#2367;&#2340; &#2310;&#2339;&#2367; &#2358;&#2381;&#2352;&#2350;&#2367;&#2359;&#2381;&#2336;&#2366;</text>
        <path d="M 245 708 q 115 22 230 0" fill="none" stroke="#C3A368" stroke-width="1.8"/>
        <circle cx="360" cy="719" r="3.4" fill="#C3A368"/>
      </g>
    </g>

    <!-- Scene 2: the family invites you -->
    <g id="scene2">
      <text id="s2-family" class="rv rv-fade dev" x="360" y="578" font-size="42"
            fill="#8A6234" text-anchor="middle">&#2325;&#2366;&#2355;&#2375; &#2346;&#2352;&#2367;&#2357;&#2366;&#2352;&#2366;&#2340;&#2352;&#2381;&#2347;&#2375;</text>
      <text id="s2-invites" class="rv rv-fade dev" x="360" y="632" font-size="26"
            fill="#8A7A5F" text-anchor="middle">&#2310;&#2346;&#2339;&#2366;&#2360; &#2360;&#2360;&#2381;&#2344;&#2375;&#2361; &#2344;&#2367;&#2350;&#2306;&#2340;&#2381;&#2352;&#2339;</text>
      <text id="s2-event" class="rv rv-fade disp" x="360" y="702" font-size="44"
            fill="#7C3A2C" text-anchor="middle">&#2360;&#2366;&#2326;&#2352;&#2346;&#2369;&#2337;&#2366; &#2360;&#2350;&#2366;&#2352;&#2306;&#2349;</text>
    </g>

    <!-- Scene 3: venue awareness -->
    <g id="scene3">
      <text id="s3-day" class="rv rv-fade dev" x="360" y="522" font-size="24"
            fill="#8A7A5F" text-anchor="middle">&#2352;&#2357;&#2367;&#2357;&#2366;&#2352;</text>
      <text id="s3-date" class="rv rv-fade dev" x="360" y="572" font-size="40"
            fill="#43614A" text-anchor="middle">&#2407;&#2409; &#2360;&#2346;&#2381;&#2335;&#2375;&#2306;&#2348;&#2352; &#2408;&#2406;&#2408;&#2412;</text>
      <text id="s3-time" class="rv rv-fade dev" x="360" y="620" font-size="26"
            fill="#7C3A2C" text-anchor="middle">&#2342;&#2369;&#2346;&#2366;&#2352;&#2368; &#2407;&#2408;:&#2406;&#2406; &#2357;&#2366;&#2332;&#2354;&#2381;&#2351;&#2366;&#2346;&#2366;&#2360;&#2370;&#2344;</text>
      <text id="s3-venue" class="rv rv-fade disp" x="360" y="696" font-size="44"
            fill="#8A6234" text-anchor="middle">&#2361;&#2377;&#2335;&#2375;&#2354; &#2344;&#2368;&#2354;&#2325;&#2350;&#2354;</text>
      <text id="s3-address" class="rv rv-fade dev" x="360" y="744" font-size="24"
            fill="#8A7A5F" text-anchor="middle">&#2344;&#2327;&#2352; &#2352;&#2379;&#2337;, &#2332;&#2367;&#2354;&#2381;&#2361;&#2366; &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2354;&#2351;&#2366;&#2360;&#2350;&#2379;&#2352;</text>
      <text id="s3-city" class="rv rv-fade dev" x="360" y="786" font-size="30"
            fill="#43614A" text-anchor="middle">&#2348;&#2368;&#2337;</text>
    </g>
  </svg>
</div>
</body>
</html>
